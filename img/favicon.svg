<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fondo oscuro con bordes redondeados -->
  <rect width="64" height="64" rx="14" fill="#1e1e24" />
  
  <!-- Cuerpo del mando (Color morado vibrante) -->
  <rect x="8" y="20" width="48" height="24" rx="12" fill="#6c5ce7" />
  
  <!-- Cruceta (D-Pad) -->
  <rect x="18" y="26" width="4" height="12" rx="1" fill="#ffffff" />
  <rect x="14" y="30" width="12" height="4" rx="1" fill="#ffffff" />
  
  <!-- Botones de acción -->
  <circle cx="44" cy="26" r="3" fill="#00cec9" /> <!-- Arriba (Cian) -->
  <circle cx="38" cy="32" r="3" fill="#fd79a8" /> <!-- Izquierda (Rosa) -->
  <circle cx="50" cy="32" r="3" fill="#ffeaa7" /> <!-- Derecha (Amarillo) -->
  <circle cx="44" cy="38" r="3" fill="#ff7675" /> <!-- Abajo (Rojo/Coral) -->
</svg>